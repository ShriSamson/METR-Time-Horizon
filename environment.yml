name: metr-time-horizon
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core data science packages
  - numpy>=2.0.0
  - pandas>=2.2.0
  - matplotlib>=3.9.0
  - scipy>=1.14.0
  - scikit-learn>=1.5.0
  - seaborn>=0.13.2
  - statsmodels>=0.14.4
  # Jupyter support
  - ipykernel>=6.29.0
  - jupyter
  # YAML parsing
  - pyyaml
  # Typing extensions
  - typing_extensions
  # Pip-only packages
  - pip:
    - adjustText>=1.3.0
    - datasets>=3.2.0
    - dvc[s3]>=3.50.0
    - torch>=2.5.1

